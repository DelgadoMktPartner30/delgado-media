# SEO semanal con aprobación de Alejandro (D-121, D-142). La sesión de Claude en la nube deja sus
# cambios en la rama seo-semanal. Desde el 23/11/2026 este flujo YA NO los publica: solo comprueba
# los límites. Publicar = que Alejandro abra un pull request seo-semanal → main y lo fusione
# (https://github.com/DelgadoMktPartner30/delgado-media/compare/main...seo-semanal); GitHub Pages
# publica main. Cada ciclo sustituye la rama: lo no aprobado se reemplaza por la propuesta nueva.
name: SEO semanal (pendiente de aprobación)
on:
  push:
    branches: [seo-semanal]
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-semanal
          fetch-depth: 0
      - name: Comprobar límites (no publica)
        run: |
          git fetch -q origin main
          n=$(git diff --name-only origin/main HEAD | wc -l)
          echo "$n archivos cambian respecto a main"
          [ "$n" -le 10 ] || { echo "ABORTADO: demasiados archivos ($n)"; exit 1; }
          [ "$(cat CNAME)" = "www.delgado.media" ] || { echo "ABORTADO: CNAME alterado"; exit 1; }
          echo "Pendiente de aprobación: https://github.com/${{ github.repository }}/compare/main...seo-semanal"
